name: Install & Functional Test

on:
  workflow_dispatch:
    inputs:
      msi_artifact:
        description: "MSI artifact name (uploaded by the CI workflow)"
        required: false
        default: "unlose-msi"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, release/**]

# Requires a self-hosted runner running as administrator
# On the runner machine: .\config.cmd --runasservice --windowslogonaccount <admin-account>
jobs:
  install-test:
    name: MSI Install & Smoke Test
    runs-on: [self-hosted, windows, admin]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30

    env:
      INSTALL_DIR: 'C:\Program Files\unlose'
      UPGRADE_CODE: 'A0B1C2D3-E4F5-6789-ABCD-EF0123456789'
      MSI_PATH:    '${{ github.workspace }}\publish\unlose-setup-x64.msi'

    steps:
      # ------------------------------------------------------------------
      # 1. Download the MSI artifact (uploaded by the CI workflow)
      # ------------------------------------------------------------------
      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.msi_artifact || 'unlose-msi' }}
          path: publish
          # When triggered by workflow_run, point explicitly at the upstream CI run to download the artifact across workflows
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 2. Verify the MSI exists
      # ------------------------------------------------------------------
      - name: Verify MSI exists
        shell: powershell
        run: |
          if (-not (Test-Path "$env:MSI_PATH")) {
            Write-Error "MSI not found: $env:MSI_PATH"
            exit 1
          }
          $size = (Get-Item $env:MSI_PATH).Length
          Write-Host "MSI size: $([math]::Round($size/1MB,2)) MB"

      # ------------------------------------------------------------------
      # 3. Install the MSI (silent, with install log)
      # ------------------------------------------------------------------
      - name: Install MSI
        shell: powershell
        run: |
          $logFile = "$env:RUNNER_TEMP\install.log"
          $proc = Start-Process msiexec.exe -Wait -PassThru -ArgumentList `
            "/i `"$env:MSI_PATH`" /qn /l*v `"$logFile`""
          if ($proc.ExitCode -ne 0) {
            Write-Host "=== Install Log (last 50 lines) ==="
            Get-Content $logFile -Tail 50
            exit $proc.ExitCode
          }
          Write-Host "MSI installed successfully (exit code 0)"

      # ------------------------------------------------------------------
      # 4. Wait for the service to be ready
      # ------------------------------------------------------------------
      - name: Wait for service to start
        shell: powershell
        run: |
          $svcName = 'unloseService'
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          do {
            $svc = Get-Service $svcName -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq 'Running') {
              Write-Host "Service is Running."
              exit 0
            }
            Start-Sleep -Seconds 2
          } while ([DateTime]::UtcNow -lt $deadline)
          Write-Error "Service did not start within 30 seconds"
          exit 1

      # ------------------------------------------------------------------
      # 5. Pester smoke tests
      # ------------------------------------------------------------------
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Install Pester
        shell: powershell
        run: |
          if (-not (Get-Module Pester -ListAvailable | Where-Object Version -ge '5.0')) {
            Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.0

      - name: Run Pester smoke tests
        shell: powershell
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path         = 'tests\post-install.Tests.ps1'
          $cfg.Run.PassThru     = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled    = $true
          $cfg.TestResult.OutputPath = "$env:RUNNER_TEMP\pester-smoke.xml"
          $cfg.TestResult.OutputFormat = 'NUnitXml'

          $result = Invoke-Pester -Configuration $cfg
          if ($result.FailedCount -gt 0) {
            Write-Error "$($result.FailedCount) Pester test(s) failed"
            exit 1
          }

      # ------------------------------------------------------------------
      # 5b. VHDX file-restore integration tests (L2, requires the Hyper-V role; skipped if absent)
      # ------------------------------------------------------------------
      - name: Run VHDX snapshot-restore integration tests
        shell: powershell
        run: |
          # Guard: skip when neither New-VHD (Hyper-V) nor diskpart is available (in practice diskpart ships with almost every Windows)
          $hasHyperV = [bool](Get-Command New-VHD -ErrorAction SilentlyContinue)
          $hasDiskpart = [bool](Get-Command diskpart.exe -ErrorAction SilentlyContinue)
          if (-not ($hasHyperV -or $hasDiskpart)) {
            Write-Host "Neither New-VHD nor diskpart available; skipping VHDX integration tests."
            exit 0
          }
          $cfg = New-PesterConfiguration
          $cfg.Run.Path         = 'tests\snapshot-restore-e2e.Tests.ps1'
          $cfg.Run.PassThru     = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled    = $true
          $cfg.TestResult.OutputPath = "$env:RUNNER_TEMP\pester-vhdx.xml"
          $cfg.TestResult.OutputFormat = 'NUnitXml'

          $result = Invoke-Pester -Configuration $cfg
          if ($result.FailedCount -gt 0) {
            Write-Error "$($result.FailedCount) VHDX integration test(s) failed"
            exit 1
          }

      # ------------------------------------------------------------------
      # 5c. System restore point creation tests (run on the host, no Hyper-V needed; internal guards Skip)
      # ------------------------------------------------------------------
      - name: Run system restore point integration tests
        shell: powershell
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path         = 'tests\system-restore-point.Tests.ps1'
          $cfg.Run.PassThru     = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled    = $true
          $cfg.TestResult.OutputPath = "$env:RUNNER_TEMP\pester-sysrestore.xml"
          $cfg.TestResult.OutputFormat = 'NUnitXml'

          $result = Invoke-Pester -Configuration $cfg
          if ($result.FailedCount -gt 0) {
            Write-Error "$($result.FailedCount) system restore test(s) failed"
            exit 1
          }

      # ------------------------------------------------------------------
      # 6. FlaUI WPF UI tests
      # ------------------------------------------------------------------
      - name: Run WPF UI tests (FlaUI)
        shell: powershell
        env:
          UNLOSE_UI_EXE: '${{ env.INSTALL_DIR }}\unlose.UI.exe'
        run: |
          dotnet test src\Unlose.UITests\Unlose.UITests.csproj `
            -c Release `
            --logger "trx;LogFileName=ui-test-results.trx" `
            --results-directory $env:RUNNER_TEMP\ui-results `
            -- xunit.parallelizeTestCollections=false

      # ------------------------------------------------------------------
      # 7. Upload test reports
      # ------------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-results
          path: |
            ${{ runner.temp }}/pester-smoke.xml
            ${{ runner.temp }}/pester-vhdx.xml
            ${{ runner.temp }}/pester-sysrestore.xml
            ${{ runner.temp }}/ui-results/*.trx
            ${{ runner.temp }}/install.log

      # ------------------------------------------------------------------
      # 8. Uninstall the MSI (always run, keep the runner clean)
      # ------------------------------------------------------------------
      - name: Uninstall MSI
        if: always()
        shell: powershell
        run: |
          $logFile = "$env:RUNNER_TEMP\uninstall.log"
          $proc = Start-Process msiexec.exe -Wait -PassThru -ArgumentList `
            "/x {$env:UPGRADE_CODE} /qn /l*v `"$logFile`""
          Write-Host "Uninstall exit code: $($proc.ExitCode)"
